[project]
name = "ai-conversation-backend"
version = "0.1.0"
description = "Study control API for the Japanese conversation app"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
]

[project.optional-dependencies]
calls = [
    "boto3>=1.36,<2",
    "livekit-api>=1,<2",
    "pipecat-ai[livekit]>=0.0.108,<0.0.109",
]
tutor = [
    "pipecat-ai[kokoro,whisper]>=0.0.108,<0.0.109",
    "misaki[ja]>=0.9.4,<0.10",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
