# Local development only; production database credentials and durable backups are separate decisions.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: conversation
      POSTGRES_USER: conversation
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - conversation_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conversation -d conversation"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  conversation_pg_data:
